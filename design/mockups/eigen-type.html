<style>
  :root{
    --bg:#ffffff; --tile:#f5f5f7; --ink:#1d1d1f; --ink-2:#6e6e73; --line:#d2d2d7;
    --matcha:#8a9a5b; --matcha-text:#55633a;
    --display:Onest,-apple-system,system-ui,sans-serif; --display-weight:600; --display-track:-.03em;
    --text:Onest,-apple-system,system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
    --ease-out:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;margin:0}
  html{-webkit-font-smoothing:antialiased}
  html,body{overflow-x:clip}
  body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.47;letter-spacing:-.01em}
  ::selection{background:#dfe5cf;color:var(--ink)}
  :focus-visible{outline:2px solid var(--matcha-text);outline-offset:3px;border-radius:8px}
  a{color:inherit;text-decoration:none}
  sub{font-size:.62em;vertical-align:-.25em;line-height:0;letter-spacing:0}
  .wrap{max-width:980px;margin:0 auto;padding:0 22px}
  body.locked{overflow:hidden}

  .nav{position:fixed;top:0;left:0;right:0;z-index:20;height:52px;background:rgba(255,255,255,.72);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.08);transition:opacity .8s,transform .8s}
  .nav .wrap{max-width:1040px;height:100%;display:flex;align-items:center;justify-content:space-between}
  .nav .brand{font-weight:600;font-size:15px}
  .pill{display:inline-flex;align-items:center;padding:6px 14px;border-radius:980px;background:var(--ink);color:#fff;font-size:13px;font-weight:500;transition:background .2s}
  .pill:hover{background:#3a3a3c}
  body.intro .nav{opacity:0;transform:translateY(-8px);pointer-events:none}

  /* the opening: one blob, one line */
  .hero{position:relative;height:100vh;height:100svh}
  .stage{position:relative;height:100%;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:52px 16px 0}
  .caps{position:relative;width:100%;height:150px;text-align:center}
  .caps > div{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:22px;opacity:0;transition:opacity .5s}
  .caps > div.on{opacity:1}
  .caps h1,.caps h2,.page h1,.page h2,.tile h3,.contact h2,.nav .brand{font-family:var(--display);font-weight:var(--display-weight);letter-spacing:var(--display-track)}
  .caps h1{font-size:clamp(40px,6vw,80px);line-height:1.04}
  .caps h2{font-size:clamp(26px,3.4vw,40px);font-weight:600;letter-spacing:-.025em;line-height:1.12}
  .eq{display:flex;align-items:center;gap:14px}
  .lhs{font-family:var(--mono);font-weight:500;font-size:clamp(18px,2vw,26px);white-space:nowrap;min-width:5.2em;text-align:right;opacity:0;transition:opacity .25s}
  .lhs.on{opacity:1}
  .mx{position:relative}
  #ascii{display:block;cursor:none}
  .tap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:transparent;border:0;cursor:pointer;z-index:2}
  .tap:focus-visible{outline:2px solid var(--matcha-text);outline-offset:6px}
  .tap[hidden]{display:none}
  .dg{position:absolute;z-index:3;background:transparent;border:0;border-radius:10px;cursor:pointer;padding:0;display:none}
  body.solved .dg{display:block}
  .cue{position:absolute;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:13px;color:var(--ink-2);white-space:nowrap;opacity:0;transition:opacity .8s;pointer-events:none;display:flex;align-items:center;gap:10px}
  .cue.on{opacity:1}
  .cue i{width:9px;height:9px;border-radius:50%;background:var(--matcha);position:relative}
  .cue i:after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px solid var(--matcha);animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite}
  @keyframes ping{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.8);opacity:0}}
  .hint{position:absolute;bottom:4vh;left:0;right:0;text-align:center;font-family:var(--mono);font-size:12.5px;color:var(--ink-2);opacity:0;transition:opacity .5s}
  .replay{position:absolute;bottom:4vh;right:24px;font-family:var(--mono);font-size:12px;color:var(--ink-2);background:none;border:0;cursor:pointer;opacity:0;transition:opacity .6s;pointer-events:none}
  .replay.on{opacity:1;pointer-events:auto}
  .replay:hover{color:var(--ink)}

  .contact{text-align:center;padding:130px 0 120px}
  .contact h2{font-size:clamp(34px,4.4vw,50px);font-weight:600;letter-spacing:-.028em;line-height:1.08}
  .mail{display:inline-block;margin-top:24px;font-family:var(--mono);font-size:clamp(20px,2.8vw,32px);font-weight:500;letter-spacing:-.02em;color:var(--matcha-text)}
  .mail:hover{text-decoration:underline;text-underline-offset:6px}
  .more{margin-top:22px;display:flex;gap:26px;justify-content:center;font-size:17px;color:var(--matcha-text)}
  .more a:hover{text-decoration:underline;text-underline-offset:3px}
  footer{border-top:1px solid #e8e8ed;color:var(--ink-2);font-size:12px;padding:20px 0}

  /* an eigenvalue, expanded into its own page */
  .sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
  .sheet[hidden]{display:none}
  .sbar{position:sticky;top:0;z-index:2;height:52px;background:rgba(255,255,255,.78);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.08)}
  .sbar .wrap{height:100%;display:flex;align-items:center;justify-content:space-between;max-width:1040px}
  .back{display:inline-flex;align-items:center;gap:8px;font:500 14px var(--text);color:var(--ink);background:none;border:0;cursor:pointer;padding:8px 10px;margin-left:-10px;border-radius:980px}
  .back:hover{background:var(--tile)}
  .back svg{width:8px;height:13px}
  .crumb{font-family:var(--mono);font-size:13px;color:var(--ink-2)}
  .page{padding:72px 0 120px}
  #pageTitle:focus{outline:none}
  .page .fig{font-family:var(--mono);font-size:clamp(28px,3vw,36px);font-weight:500;color:var(--matcha-text)}
  .page h1{margin-top:6px;font-size:clamp(48px,7vw,88px);font-weight:600;letter-spacing:-.035em;line-height:1.02}
  .page .lede{margin-top:14px;max-width:34ch;font-size:clamp(21px,2.2vw,26px);font-weight:500;color:var(--ink-2);letter-spacing:-.015em;line-height:1.3}
  .page h2{margin-top:84px;font-size:clamp(28px,3vw,36px);font-weight:600;letter-spacing:-.025em;line-height:1.12}
  .page h2 + *{margin-top:24px}
  .prose{margin-top:44px;display:grid;grid-template-columns:200px 1fr;gap:48px;align-items:start}
  .prose img{width:200px;aspect-ratio:1;border-radius:28px;object-fit:cover;background:var(--tile)}
  .prose p{font-size:19px;line-height:1.58;max-width:62ch}
  .prose p + p{margin-top:16px}
  .prose strong{font-weight:600}
  .spec{border-top:1px solid var(--line)}
  .spec .row{display:grid;grid-template-columns:150px 1fr 1.1fr;gap:24px;padding:22px 0;border-bottom:1px solid var(--line)}
  .spec .yr{font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums;padding-top:3px}
  .spec .role{font-weight:600;font-size:18px;letter-spacing:-.015em}
  .spec .org{color:var(--ink-2);font-size:16px}
  .spec .what{font-size:16.5px}
  .spec .tag{display:inline-block;margin-top:6px;font-size:12.5px;color:var(--matcha-text)}
  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
  .tile{background:var(--tile);border-radius:28px;padding:30px 30px 32px;display:flex;flex-direction:column}
  .tile h3{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.16}
  .tile p{margin-top:8px;color:var(--ink-2);font-size:16.5px}
  .tile .meta{margin-top:auto;padding-top:18px;font-size:13.5px;color:var(--ink-2)}
  .tile .shot{margin-top:20px;border-radius:14px;aspect-ratio:16/10;background:#e8e8ed center/cover;box-shadow:0 20px 40px -24px rgba(0,0,0,.35)}
  .tile a{color:var(--matcha-text)}
  .tile a:hover{text-decoration:underline;text-underline-offset:3px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chips span{padding:7px 14px;border-radius:980px;background:var(--tile);font-size:14.5px}
  .empty{margin-top:56px;padding:56px 40px;border-radius:28px;background:var(--tile);text-align:center}
  .empty .fig{font-size:clamp(36px,4vw,52px)}
  .empty p{margin:12px auto 0;max-width:40ch;color:var(--ink-2);font-size:18px}
  .drafts{margin-top:24px;list-style:none;padding:0;border-top:1px solid var(--line)}
  .drafts li{display:flex;justify-content:space-between;gap:20px;padding:18px 0;border-bottom:1px solid var(--line);font-size:18px}
  .drafts span{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);white-space:nowrap;padding-top:4px}
  .next{margin-top:96px;padding-top:28px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px}
  .next a{display:flex;flex-direction:column;gap:2px;font-size:22px;font-weight:600;letter-spacing:-.02em}
  .next a span{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--matcha-text)}
  .next a:hover{color:var(--matcha-text)}
  .next a.r{text-align:right;margin-left:auto}


  /* mockup only: type picker */
  .picker{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:4px;padding:5px;border-radius:980px;background:rgba(255,255,255,.82);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border:1px solid rgba(0,0,0,.08);box-shadow:0 18px 40px -20px rgba(0,0,0,.35);font-family:Onest,system-ui,sans-serif;max-width:calc(100vw - 24px);overflow-x:auto}
  .picker p{font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--ink-2);margin:0 8px 0 10px}
  .picker .opts{display:flex;gap:2px}
  .picker button{font:500 13.5px Onest,system-ui,sans-serif;color:var(--ink);padding:8px 14px;border-radius:980px;border:0;background:transparent;cursor:pointer;white-space:nowrap;transition:background .2s}
  .picker button:hover{background:var(--tile)}
  .picker button[aria-pressed="true"]{background:var(--ink);color:#fff}
  .picker .spec{display:none}
  .hint,.replay{bottom:calc(4vh + 52px)}
  @media (max-width:760px){
    .eq{flex-direction:column;gap:8px}.lhs{min-width:0;text-align:center}
    .caps{height:130px}
    .prose{grid-template-columns:1fr;gap:28px}.prose img{width:120px}
    .spec .row{grid-template-columns:1fr;gap:4px}
    .tiles{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){.nav,.caps > div,.cue,.lhs,.hint{transition:none}.cue i:after{animation:none}}
</style>

    if(tk>0){ ctx.fillRect(x0,y0,tk,sw); ctx.fillRect(x0,y1-sw,tk,sw); ctx.fillRect(x1-tk,y0,tk,sw); ctx.fillRect(x1-tk,y1-sw,tk,sw); } }
  textTex.needsUpdate=true;

  U.tMass.value=massRT.texture; U.tDrop.value=dropRT.texture; U.uT.value=t; U.uMove.value=k; U.uDis.value=m0*1.02; U.uShadow.value=(1-m0)*drain*bloom;
  U.uPtr.value.set(ptr.px*U.uRes.value.x,(1-ptr.py)*U.uRes.value.y,ptr.s);
  renderer.render(compScene,compCam);

  if(tt>=0){
    lhs.classList.toggle('on',tt>.5);
    const ph=m2>.5?3:m1>.5?2:1;
    if(ph!==phase){ phase=ph; lhs.textContent=['Gordon =','Gordon =','A =','Λ ='][ph]; caps.forEach((c,i)=>c.classList.toggle('on',i===ph-1&&ph>1)); }
    const done=m2>=.999;
    if(done&&!solved){ solved=true; document.body.classList.remove('intro','locked'); document.body.classList.add('solved'); replay.classList.add('on');
      view.setAttribute('aria-label','The matrix Lambda: About, Experience, Research, Interests and Blog on its diagonal, zeros elsewhere'); }
    hint.style.opacity=done&&scrollY<40?1:0;
  }
}

// ================= expanding an eigenvalue into its page =================
const sheet=$('sheet'), body=$('pageBody'), crumb=$('crumb'), backBtn=$('back');
let curK=-1, srcEl=null, pushed=false;
const rectClip=r=>`inset(${Math.max(0,r.top)}px ${Math.max(0,innerWidth-r.right)}px ${Math.max(0,innerHeight-r.bottom)}px ${Math.max(0,r.left)}px round 22px)`;
function render(k){
  const s=SECTIONS[k], prev=SECTIONS[k-1], next=SECTIONS[k+1];
  crumb.innerHTML=`λ<sub>${k+1}</sub> · ${s.name}`;
  body.innerHTML=`<div class="pin"><p class="fig">λ<sub>${k+1}</sub></p><h1 id="pageTitle" tabindex="-1">${s.name}</h1><p class="lede">${s.lede}</p></div>${s.body()}
    <nav class="next" aria-label="Other eigenvalues">${prev?`<a href="#${prev.id}" data-k="${k-1}"><span>← λ${k}</span>${prev.name}</a>`:''}${next?`<a class="r" href="#${next.id}" data-k="${k+1}"><span>λ${k+2} →</span>${next.name}</a>`:''}</nav>`;
  body.querySelectorAll('.next a').forEach(a=>a.addEventListener('click',e=>{ e.preventDefault(); const j=+a.dataset.k; history.replaceState({k:j},'','#'+SECTIONS[j].id); show(j,true); }));
}
function show(k,swap,instant){ curK=k; render(k); sheet.scrollTop=0;
  if(!reduce&&!instant) body.querySelector('.pin').animate([{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],{duration:520,delay:swap?0:200,easing:'cubic-bezier(.16,1,.3,1)',fill:'backwards'});
  $('pageTitle').focus({preventScroll:true}); }
function openSheet(k,el,{push=true,instant=false}={}){
  srcEl=el; sheet.hidden=false; document.body.style.overflow='hidden'; show(k,false,instant);
  if(push){ history.pushState({k},'','#'+SECTIONS[k].id); pushed=true; }
  if(!reduce&&!instant&&el){ sheet.animate([{clipPath:rectClip(el.getBoundingClientRect())},{clipPath:'inset(0px 0px 0px 0px round 0px)'}],{duration:640,easing:'cubic-bezier(.2,.8,.2,1)'}); }
}
function closeSheet(){
  if(sheet.hidden) return;
  // shrink back into this eigenvalue's cell in the matrix; if the matrix is off screen, just fade
  const cell=dgEls[curK], r=cell.getBoundingClientRect(), onScreen=r.width>0&&r.bottom>0&&r.top<innerHeight;
  const done=()=>{ sheet.hidden=true; document.body.style.overflow=''; cell.focus({preventScroll:true}); curK=-1; };
  if(reduce) return done();
  sheet.animate(onScreen?[{clipPath:'inset(0px 0px 0px 0px round 0px)'},{clipPath:rectClip(r)}]:[{opacity:1},{opacity:0}],{duration:onScreen?420:240,easing:'cubic-bezier(.4,0,.6,1)'}).onfinish=done;
}
backBtn.addEventListener('click',()=>{ if(pushed){ pushed=false; history.back(); } else { history.replaceState(null,'',location.pathname+location.search); closeSheet(); } });
addEventListener('keydown',e=>{ if(e.key==='Escape'&&!sheet.hidden) backBtn.click(); });
addEventListener('popstate',()=>{ const k=SECTIONS.findIndex(s=>'#'+s.id===location.hash); if(k<0) { pushed=false; closeSheet(); } else if(k!==curK) openSheet(k,dgEls[k],{push:false}); });

function applyType(t,relayout){ TY=t; const r=document.documentElement.style;
  r.setProperty('--display',`"${t.display}",system-ui,sans-serif`); r.setProperty('--display-weight',t.dw); r.setProperty('--display-track',t.dt);
  r.setProperty('--text',`"${t.text}",system-ui,sans-serif`); r.setProperty('--mono',`"${t.mono}",ui-monospace,monospace`);
  $('spec').textContent=t.note; [...$('opts').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===t.id));
  const u=new URL(location.href); u.searchParams.set('font',t.id); history.replaceState(history.state,'',u);
  if(relayout) document.fonts.load(`${t.mw} 22px "${t.mono}"`).then(()=>{ layout(); placeTap(); }); }
TYPES.forEach(t=>{ const b=document.createElement('button'); b.type='button'; b.dataset.id=t.id; b.textContent=t.label; b.onclick=()=>applyType(t,true); $('opts').appendChild(b); });
applyType(TY,false);
addEventListener('resize',()=>layout());
document.fonts.load(`${TY.mw} 22px "${TY.mono}"`).then(()=>document.fonts.ready).then(()=>{
  layout(); placeTap(); loadAt=performance.now();
  // a shared link to a section skips straight past the opening
  const k=SECTIONS.findIndex(s=>'#'+s.id===location.hash);
  if(k>=0||Q.has('solved')){ solveNow(); if(k>=0) openSheet(k,dgEls[k],{push:false,instant:true}); }
  requestAnimationFrame(frame);
});
function placeTap(){ const s=Math.min(W,H)*.62; tap.style.width=tap.style.height=s+'px'; cue.style.top=(H/2+H*.32)+'px'; }
addEventListener('resize',placeTap);
if(matchMedia('(pointer: coarse)').matches) cue.lastChild.textContent='tap the mercury';
</script>
